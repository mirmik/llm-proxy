listen:
  host: "0.0.0.0"
  port: 8090

cache_dir: "~/.cache/llm-proxy/kv"
state_dir: "~/.config/llm-proxy"

kv_cache:
  # Save the first successful state immediately, then checkpoint when either
  # limit is reached. Pending clean state is always saved on eviction/stop.
  checkpoint_interval_minutes: 5
  checkpoint_max_requests: 5

tls:
  enabled: false
  cert_file: "~/.config/llm-proxy/certs/server.crt"
  key_file: "~/.config/llm-proxy/certs/server.key"

auth:
  enabled: false
  bootstrap_password: null

defaults:
  llama_bin: "/home/mirmik/project/llama.cpp/build_vulkan/bin/llama-server"

runtimes:
  qwen3.5-122b:
    driver: "llama_cpp"
    gpu: "local"
    autoload: true
    port: 8081
    slots: 2
    command: >
      {defaults.llama_bin}
      --model ~/project/models/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf
      -ngl 99 -c 131072 -np {slots}
      --host 127.0.0.1 --port {port}
      --slot-save-path {runtime_kv}
      --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
      -b 4096 -ub 4096
      --jinja

  qwen3.5-35b-a3b:
    driver: "llama_cpp"
    gpu: "local"
    autoload: false
    port: 8082
    slots: 1
    command: >
      {defaults.llama_bin}
      --model ~/project/models/Qwen3.5-35B-A3B-Q4_K_M.gguf
      -ngl 99 -c 131072 -np {slots}
      --host 127.0.0.1 --port {port}
      --slot-save-path {runtime_kv}
      --flash-attn on
      --jinja

  bge-m3:
    driver: "llama_cpp_embedding"
    gpu: "local"
    autoload: false
    on_demand: true
    port: 8084
    slots: 2
    command: >
      {defaults.llama_bin}
      --model ~/project/models/bge-m3-Q8_0.gguf
      --host 127.0.0.1 --port {port}
      --embedding --pooling cls --parallel {slots}
      -c 16384 -b 2048 -ub 2048

  stt-main:
    driver: "faster_whisper"
    gpu: "local"
    autoload: false
    port: 5055
    venv: "~/project/voice-input/.venv"
    command: >
      {python} {runners_dir}/faster_whisper_server.py
      --host 127.0.0.1 --port {port}
      --model-size large-v3
      --language ru
      --device cuda
      --compute-type float16
      --sample-rate 16000

  tts-main:
    driver: "xtts"
    gpu: "local"
    autoload: false
    port: 5050
    venv: "~/project/for-tts-xtts/.venv311"
    command: >
      {python} {runners_dir}/xtts_server.py
      --host 127.0.0.1 --port {port}
      --model-name tts_models/multilingual/multi-dataset/xtts_v2
      --reference-wav ~/project/for-tts-xtts/reference.wav
      --language ru
      --device cuda
      --sample-rate 24000
    env:
      COQUI_TOS_AGREED: "1"

gpu_groups:
  local: 32768
  cluster: null
